{% extends "layout_thirds.html" %}

{% block title %}{{ page.title }}{% endblock title %}

{% block content %}
  <div class="centered{% if page.extra.layout_class %} {{ page.extra.layout_class }}{% endif %}">
    {% if page.title %}
      <h1 class="title">{{ page.title }}</h1>
    {% endif %}
    {{ page.content | safe }}
  </div>
{% endblock content %}
